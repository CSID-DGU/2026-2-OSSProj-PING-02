<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4D6578" flood-opacity="0.20"/>
    </filter>
    <filter id="bubbleShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#52697A" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    </style>
  </defs>

  <g transform="translate(0 250)">
  <!-- The canvas outside this rounded chat panel is transparent. -->
  <rect x="40" y="38" width="1120" height="624" rx="44" fill="#B8CDDE" filter="url(#panelShadow)"/>

  <!-- subtle Kakao-style chat-room header -->
  <path d="M40 82a44 44 0 0 1 44-44h1032a44 44 0 0 1 44 44v70H40z" fill="#C7D8E5"/>
  <path d="M94 95l18-18m-18 18 18 18" fill="none" stroke="#415261" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="105" text-anchor="middle" class="ui" font-size="31" font-weight="700" fill="#26343E">민지</text>
  <circle cx="1086" cy="94" r="5" fill="#415261"/>
  <circle cx="1105" cy="94" r="5" fill="#415261"/>
  <circle cx="1124" cy="94" r="5" fill="#415261"/>

  <!-- Minji: received message, white bubble -->
  <circle cx="112" cy="236" r="34" fill="#F7E7BD"/>
  <circle cx="112" cy="224" r="12" fill="#E4B95D"/>
  <path d="M104 214c2-11 13-18 24-17-2 12-10 20-24 17z" fill="#829B55"/>
  <text x="165" y="208" class="ui" font-size="22" font-weight="600" fill="#536675">민지</text>
  <g filter="url(#bubbleShadow)">
    <path d="M166 224h662a30 30 0 0 1 30 30v72a30 30 0 0 1-30 30H166a30 30 0 0 1-30-30v-72a30 30 0 0 1 30-30z" fill="#FFFFFF"/>
    <path d="M145 242l-28 22 34 8z" fill="#FFFFFF"/>
  </g>
  <text x="178" y="304" class="ui" font-size="31" font-weight="500" fill="#252B30">나 다음 달에 결혼해! 시간 되면 꼭 와줘 😊</text>
  <text x="872" y="340" class="ui" font-size="19" fill="#657D8E">오후 2:18</text>

  <!-- Haneul: yellow draft bubble -->
  <text x="1018" y="422" text-anchor="end" class="ui" font-size="22" font-weight="600" fill="#536675">하늘 · 작성 중</text>
  <g filter="url(#bubbleShadow)">
    <path d="M498 438h516a30 30 0 0 1 30 30v72a30 30 0 0 1-30 30H498a30 30 0 0 1-30-30v-72a30 30 0 0 1 30-30z" fill="#F8D96B"/>
    <path d="M1035 456l30 21-35 9z" fill="#F8D96B"/>
  </g>
  <text x="518" y="518" class="ui" font-size="32" font-weight="600" fill="#332D22">축하해! 오랜만인데…</text>
  <rect x="809" y="486" width="3" height="38" rx="1.5" fill="#685A36"/>

  <!-- deleted-draft annotation -->
  <g opacity="0.86">
    <path d="M805 592c45 16 100 16 143 0" fill="none" stroke="#91A6B5" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 9"/>
    <rect x="808" y="590" width="210" height="44" rx="22" fill="#DCE7EF"/>
    <path d="M835 607l15 15m0-15-15 15" stroke="#718897" stroke-width="3.5" stroke-linecap="round"/>
    <text x="866" y="620" class="ui" font-size="20" font-weight="600" fill="#627986">문장을 지움</text>
  </g>
  </g>
</svg>
