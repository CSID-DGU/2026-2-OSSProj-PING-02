<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="650" viewBox="0 0 1680 650">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#6E521C" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#493720}.h{font-size:25px;font-weight:800}.b{font-size:19px;font-weight:700}.m{font-size:16px;font-weight:600}.s{font-size:14px;font-weight:600}.muted{fill:#84745D}.white{fill:#fff}.green{fill:#687C35}.brown{fill:#6E521C}
    </style>
  </defs>
  <rect width="1680" height="650" fill="#FFF9E7"/>

  <!-- Experiment goal -->
  <rect x="0" y="10" width="430" height="388" rx="26" fill="#FFFDF7" stroke="#E8D8AE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="24" y="30" width="144" height="40" rx="20" fill="#F7D867"/>
  <text x="96" y="57" text-anchor="middle" class="b">실험 목적</text>
  <text x="28" y="111" class="h">말씨앗의 핵심 과업 검증</text>
  <g class="m">
    <circle cx="39" cy="155" r="8" fill="#93A657"/><text x="60" y="162">한국어 메시지의 맥락 이해</text>
    <circle cx="39" cy="201" r="8" fill="#93A657"/><text x="60" y="208">핵심 내용의 간결한 요약</text>
    <circle cx="39" cy="247" r="8" fill="#93A657"/><text x="60" y="254">서로 다른 답장 후보 3개 생성</text>
    <circle cx="39" cy="293" r="8" fill="#93A657"/><text x="60" y="300">JSON 형식·안전 규칙 준수</text>
  </g>
  <rect x="24" y="332" width="382" height="42" rx="14" fill="#F4F7E9"/>
  <text x="215" y="358" text-anchor="middle" class="s green">품질과 프롬프트 설계를 먼저 확인</text>

  <!-- Baseline and environment -->
  <rect x="452" y="10" width="492" height="388" rx="26" fill="#FFFDF7" stroke="#E8D8AE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="476" y="30" width="170" height="40" rx="20" fill="#F7D867"/>
  <text x="561" y="57" text-anchor="middle" class="b">기준 모델·환경</text>
  <rect x="476" y="91" width="444" height="68" rx="17" fill="#F3F6E6" stroke="#A6B66E" stroke-width="2"/>
  <text x="698" y="121" text-anchor="middle" class="s green">BASELINE MODEL</text>
  <text x="698" y="148" text-anchor="middle" class="h">Kanana-2 1.3B Instruct</text>
  <g class="m">
    <text x="482" y="199" class="muted">실행 환경</text><text x="590" y="199">Intel i7 · 4 Core · 16GB · Windows</text>
    <text x="482" y="235" class="muted">런타임</text><text x="590" y="235">PyTorch 2.8 · Transformers 4.57</text>
    <text x="482" y="271" class="muted">실행 방식</text><text x="590" y="271">CPU · FP32 · 양자화 없음</text>
  </g>
  <line x1="476" y1="294" x2="920" y2="294" stroke="#E8D8AE"/>
  <g text-anchor="middle">
    <text x="548" y="331" class="h brown">34건</text><text x="548" y="355" class="s muted">전체 입력</text>
    <text x="698" y="331" class="h brown">30건</text><text x="698" y="355" class="s muted">LLM 처리</text>
    <text x="848" y="331" class="h brown">4건</text><text x="848" y="355" class="s muted">가드 처리</text>
  </g>

  <!-- Candidate shortlist -->
  <rect x="966" y="10" width="714" height="388" rx="26" fill="#FFFDF7" stroke="#E8D8AE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="990" y="30" width="146" height="40" rx="20" fill="#F7D867"/>
  <text x="1063" y="57" text-anchor="middle" class="b">후속 후보군</text>
  <text x="1650" y="57" text-anchor="end" class="s muted">4B 이하 · 한국어 · 라이선스 · 모바일</text>
  <g>
    <rect x="990" y="91" width="322" height="64" rx="16" fill="#F3F6E6" stroke="#93A657" stroke-width="2"/>
    <text x="1012" y="120" class="b">Mi:dm 2.0 Mini</text><text x="1287" y="120" text-anchor="end" class="b green">2.3B</text>
    <text x="1012" y="143" class="s muted">한국어 평가 근거 · MIT</text>
    <rect x="1330" y="91" width="326" height="64" rx="16" fill="#F3F6E6" stroke="#93A657" stroke-width="2"/>
    <text x="1352" y="120" class="b">Qwen 3.5 2B</text><text x="1632" y="120" text-anchor="end" class="b green">2B</text>
    <text x="1352" y="143" class="s muted">작은 크기 · 모바일 우선</text>

    <rect x="990" y="172" width="322" height="64" rx="16" fill="#FFF8DD" stroke="#E4CB74"/>
    <text x="1012" y="201" class="b">Kanana-2 3B</text><text x="1287" y="201" text-anchor="end" class="b brown">3B</text>
    <text x="1012" y="224" class="s muted">동일 계열 품질 상한</text>
    <rect x="1330" y="172" width="326" height="64" rx="16" fill="#FFF8DD" stroke="#E4CB74"/>
    <text x="1352" y="201" class="b">Qwen 3.5 4B</text><text x="1632" y="201" text-anchor="end" class="b brown">4B</text>
    <text x="1352" y="224" class="s muted">성능 상한 비교</text>

    <rect x="990" y="253" width="666" height="64" rx="16" fill="#FFF8DD" stroke="#E4CB74"/>
    <text x="1012" y="282" class="b">Gemma 4 E4B</text><text x="1632" y="282" text-anchor="end" class="b brown">유효 4B</text>
    <text x="1012" y="305" class="s muted">온디바이스 설계 검토 · 라이선스 원문 확인 필요</text>
  </g>
  <rect x="990" y="336" width="666" height="38" rx="12" fill="#FFF1D0"/>
  <text x="1323" y="360" text-anchor="middle" class="s brown">초록 테두리 모델부터 우선 비교 · 한국어 품질은 직접 실험 필요</text>

  <!-- Evaluation criteria -->
  <text x="0" y="450" class="h">평가 기준</text>
  <g>
    <rect x="0" y="472" width="316" height="104" rx="20" fill="#FFFDF7" stroke="#E8D8AE"/>
    <text x="24" y="506" class="b">01 한국어 자연스러움</text><text x="24" y="537" class="s muted">문법·어순·상황에 맞는 톤</text>
    <rect x="338" y="472" width="316" height="104" rx="20" fill="#FFFDF7" stroke="#E8D8AE"/>
    <text x="362" y="506" class="b">02 사실 일치성</text><text x="362" y="537" class="s muted">없는 일정·약속 생성 여부</text>
    <rect x="676" y="472" width="316" height="104" rx="20" fill="#FFFDF7" stroke="#E8D8AE"/>
    <text x="700" y="506" class="b">03 요약·답장 유용성</text><text x="700" y="537" class="s muted">핵심 요약과 전송 가능한 답장</text>
    <rect x="1014" y="472" width="316" height="104" rx="20" fill="#FFFDF7" stroke="#E8D8AE"/>
    <text x="1038" y="506" class="b">04 형식 준수</text><text x="1038" y="537" class="s muted">JSON·리스트·길이 조건</text>
    <rect x="1352" y="472" width="328" height="104" rx="20" fill="#FFFDF7" stroke="#E8D8AE"/>
    <text x="1376" y="506" class="b">05 실행 성능</text><text x="1376" y="537" class="s muted">응답 시간·메모리·실기기 실행</text>
  </g>
  <rect x="0" y="596" width="1680" height="46" rx="18" fill="#F4F7E9"/>
  <text x="840" y="625" text-anchor="middle" class="s green">※ 이번 실험은 품질·프롬프트 검증용 CPU 테스트이며, 모바일 성능을 예측하지 않습니다.</text>
</svg>
