    <g filter="url(#cs)"><rect x="535" y="322" width="530" height="250" rx="28" fill="#FFF7DD"/><rect x="565" y="352" width="42" height="42" rx="12" fill="#F8D96B"/><path d="M578 363h16m-16 9h16m-16 9h11" stroke="#8A6048" stroke-width="3.5" stroke-linecap="round"/><text x="627" y="381" class="t b" font-size="23" font-weight="750">붙여넣은 메시지</text><text x="565" y="431" class="t b" font-size="20">안녕하세요! 다음 주 진행되는 프로젝트</text><text x="565" y="463" class="t b" font-size="20">관련해서 몇 가지 공유드리려고 해요.</text><text x="565" y="495" class="t b" font-size="20">우선 일정은 화요일로 조정되었고…</text><text x="565" y="535" class="t m" font-size="17">긴 내용은 필요한 부분만 간단히 정리해드려요</text></g>
    <text x="535" y="636" class="t b" font-size="27" font-weight="800">요약 결과</text><rect x="535" y="663" width="94" height="38" rx="19" fill="#E9F0D8"/><text x="582" y="689" text-anchor="middle" class="t b" font-size="17" font-weight="700">핵심 3개</text>
    <g filter="url(#cs)"><rect x="535" y="726" width="530" height="330" rx="28" fill="#FFFFFF" stroke="#EDE2D6" stroke-width="2"/>
      <circle cx="581" cy="786" r="20" fill="#F8D96B"/><text x="581" y="793" text-anchor="middle" class="t b" font-size="17" font-weight="800">1</text><text x="622" y="778" class="t b" font-size="21" font-weight="700">프로젝트 일정이 화요일로 변경</text><text x="622" y="810" class="t m" font-size="18">오후 2시 온라인 회의</text>
      <line x1="565" y1="842" x2="1034" y2="842" stroke="#EFE6DC" stroke-width="2"/>
      <circle cx="581" cy="892" r="20" fill="#F8D96B"/><text x="581" y="899" text-anchor="middle" class="t b" font-size="17" font-weight="800">2</text><text x="622" y="884" class="t b" font-size="21" font-weight="700">준비해야 할 자료가 두 가지</text><text x="622" y="916" class="t m" font-size="18">화면 설계안 · 진행 상황 정리</text>
      <line x1="565" y1="948" x2="1034" y2="948" stroke="#EFE6DC" stroke-width="2"/>
      <circle cx="581" cy="998" r="20" fill="#8EA05A"/><text x="581" y="1005" text-anchor="middle" class="t" font-size="17" font-weight="800" fill="#FFFFFF">3</text><text x="622" y="990" class="t b" font-size="21" font-weight="700">확인 후 참석 여부 답장 필요</text><text x="622" y="1022" class="t m" font-size="18">오늘 안으로 회신하면 돼요</text>
    </g>
    <g filter="url(#cs)"><rect x="535" y="1100" width="530" height="112" rx="28" fill="#F4EEE8"/><circle cx="584" cy="1156" r="24" fill="#FFFDF9"/><path d="M574 1156h20m-10-10v20" stroke="#8EA05A" stroke-width="4" stroke-linecap="round"/><text x="626" y="1148" class="t b" font-size="21" font-weight="750">알림에서 잘린 메시지도 괜찮아요</text><text x="626" y="1178" class="t m" font-size="17">공유하거나 붙여넣으면 이어서 분석해요</text></g>
